<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="pwl-title pwl-desc">
  <title id="pwl-title">Stack of a public website as three labeled layers</title>
  <desc id="pwl-desc">A diagram of a public website as a stack of three layers: pages, content sources, and static delivery, connected by downward arrows.</desc>

  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>

  <defs>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
    <marker id="pwl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Heading -->
  <text x="360" y="40" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#0f172a">Public web, as a stack</text>

  <!-- Layer 1: pages -->
  <rect x="160" y="70" width="400" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="97" text-anchor="middle" class="label" font-size="15" font-weight="600" fill="#0f172a">Pages visitors open</text>
  <text x="360" y="117" text-anchor="middle" class="mono" font-size="12" fill="#475569">/en  /vi  /en/blog  /vi/blog  /en/blog/&lt;slug&gt;</text>

  <line x1="360" y1="134" x2="360" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#pwl-arrow)"/>

  <!-- Layer 2: content -->
  <rect x="160" y="162" width="400" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="189" text-anchor="middle" class="label" font-size="15" font-weight="600" fill="#0f172a">Content written per locale</text>
  <text x="360" y="209" text-anchor="middle" class="mono" font-size="12" fill="#475569">Markdown + frontmatter, collocated media</text>

  <line x1="360" y1="226" x2="360" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#pwl-arrow)"/>

  <!-- Layer 3: delivery -->
  <rect x="160" y="254" width="400" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="281" text-anchor="middle" class="label" font-size="15" font-weight="600" fill="#0f172a">Static delivery from the edge</text>
  <text x="360" y="301" text-anchor="middle" class="mono" font-size="12" fill="#475569">prerendered HTML + assets, no runtime database</text>

  <!-- Footer note -->
  <text x="360" y="342" text-anchor="middle" class="label" font-size="12" fill="#64748b">Each layer stays simple so the whole stack stays reviewable</text>
</svg>
