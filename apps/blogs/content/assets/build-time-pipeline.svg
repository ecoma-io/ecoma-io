<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="btp-title btp-desc">
  <title id="btp-title">Build-time content pipeline</title>
  <desc id="btp-desc">A left-to-right pipeline diagram: Markdown files flow through a build step that queries content and emits prerendered HTML files.</desc>

  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>

  <defs>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
    <marker id="btp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Heading -->
  <text x="360" y="40" text-anchor="middle" class="label" font-size="19" font-weight="700" fill="#0f172a">Content is resolved at build time</text>

  <!-- Stage 1: sources -->
  <rect x="50" y="110" width="180" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" class="label" font-size="14" font-weight="600" fill="#0f172a">Markdown files</text>
  <text x="140" y="160" text-anchor="middle" class="mono" font-size="11" fill="#475569">en/blog/*.md</text>
  <text x="140" y="177" text-anchor="middle" class="mono" font-size="11" fill="#475569">vi/blog/*.md</text>

  <!-- Stage 2: build -->
  <rect x="290" y="110" width="150" height="84" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="365" y="140" text-anchor="middle" class="label" font-size="14" font-weight="600" fill="#0f172a">Static build</text>
  <text x="365" y="160" text-anchor="middle" class="mono" font-size="11" fill="#475569">queries run once,</text>
  <text x="365" y="177" text-anchor="middle" class="mono" font-size="11" fill="#475569">on the build machine</text>

  <!-- Stage 3: output -->
  <rect x="500" y="110" width="170" height="84" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="585" y="140" text-anchor="middle" class="label" font-size="14" font-weight="600" fill="#0f172a">Plain files</text>
  <text x="585" y="160" text-anchor="middle" class="mono" font-size="11" fill="#475569">HTML, CSS, SVG</text>
  <text x="585" y="177" text-anchor="middle" class="mono" font-size="11" fill="#475569">served from the edge</text>

  <!-- Flow arrows -->
  <line x1="230" y1="152" x2="284" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#btp-arrow)"/>
  <line x1="440" y1="152" x2="494" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#btp-arrow)"/>

  <!-- Footer note -->
  <text x="360" y="248" text-anchor="middle" class="label" font-size="12" fill="#64748b">No content database runs in production - the build already wrote every answer down</text>
</svg>
