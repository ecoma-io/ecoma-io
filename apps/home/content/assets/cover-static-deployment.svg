<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="csd-title csd-desc">
  <title id="csd-title">Cover: static deployment</title>
  <desc id="csd-desc">Cover illustration of a file folder of HTML pages flowing onto a globe of CDN edge nodes, drawn flat on a light background.</desc>

  <defs>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#f8fafc"/>
  <rect x="0" y="620" width="1280" height="100" fill="#e2e8f0"/>

  <!-- folder of files -->
  <g>
    <path d="M 220 300 h 160 l 36 40 h 200 a 16 16 0 0 1 16 16 v 160 a 16 16 0 0 1 -16 16 h -396 a 16 16 0 0 1 -16 -16 v -200 a 16 16 0 0 1 16 -16 z" fill="#0f172a"/>
    <rect x="250" y="376" width="120" height="72" rx="8" fill="#ffffff"/>
    <text x="310" y="424" class="mono" font-size="26" fill="#0f172a" text-anchor="middle">.html</text>
    <rect x="392" y="376" width="120" height="72" rx="8" fill="#ffffff"/>
    <text x="452" y="424" class="mono" font-size="26" fill="#0f172a" text-anchor="middle">.svg</text>
  </g>

  <!-- flow arrow -->
  <path d="M 670 420 h 150 m -30 -26 l 36 26 l -36 26" stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- edge globe -->
  <g>
    <circle cx="1000" cy="400" r="170" fill="#ffffff" stroke="#334155" stroke-width="6"/>
    <ellipse cx="1000" cy="400" rx="170" ry="66" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <ellipse cx="1000" cy="400" rx="66" ry="170" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="1000" cy="230" r="16" fill="#10b981"/>
    <circle cx="1160" cy="440" r="16" fill="#10b981"/>
    <circle cx="860" cy="480" r="16" fill="#10b981"/>
    <circle cx="1000" cy="400" r="16" fill="#10b981"/>
  </g>

  <!-- platform base -->
  <text x="640" y="686" class="label" font-size="28" fill="#64748b" text-anchor="middle">ecoma.io</text>
</svg>
