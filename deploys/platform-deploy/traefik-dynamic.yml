# Dynamic configuration của Traefik (file provider) — nội dung tĩnh, bind-mount
# vào container tại /tmp/traefik-dynamic.yml.
#
# Vì sao là file bind-mount thay vì `uploads` của @pulumi/docker: cơ chế upload
# content của provider 5.2.0 remount rootfs của container read-only lúc tạo —
# Docker rootless cấm operation đó ("remount-ro ... operation not permitted").
# Bind-mount file thường hoạt động trên cả rootful lẫn rootless.
#
# `defaultCertificate` của store mặc định phục vụ MỌI hostname không có
# certificate riêng, nên một store là đủ cho `fbi.com` lẫn subdomain sau này.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/fbi.com.crt
        keyFile: /certs/fbi.com.key
