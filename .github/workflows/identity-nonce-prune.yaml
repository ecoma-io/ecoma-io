name: Identity nonce prune

# Dọn nonce hết hạn cho hai kho nonce của đường nội bộ:
# `auth.internal_nonces` (db-auth) và `account.internal_nonces` (db-account).
#
# Lịch chạy này được thêm cho issue #209; phần **biên và fail-closed** của cùng
# công việc được theo dõi ở issue #284 (PR #257 đã merge một bản xoá không biên).
#
# Vì sao là CI runner chứ không phải `scheduled()` handler trong Worker:
#
#   - `auth` runtime **không có** `DELETE` trên `auth.internal_nonces`
#     (`apps/auth/migrations/0010_internal_nonces.sql`: cấp `SELECT, INSERT` rồi
#     `REVOKE UPDATE, DELETE, TRUNCATE`), và không được cấp thêm chỉ để Cron chạy
#     được. `ecoma_auth_migrator` là principal đã được thiết kế cho việc này, và
#     credential đó theo quyết định của repo **không bao giờ** là Worker secret
#     ([`docs/overview/02-delivery.md`] §3.1, §6) — nên job không thể chạy bên
#     trong Worker.
#   - Bản chép ở `account` **có** cấp `DELETE` cho runtime
#     (`apps/account/db/migrations/0003_internal_nonces.sql`), nhưng job dưới đây
#     vẫn dùng credential `_migrator_` của **chính** service đó: hai job đối
#     xứng, và không job nào phụ thuộc vào ngoại lệ quyền của bên kia.
#   - Cơ chế đã tồn tại: migration PostgreSQL của repo chạy từ CI runner bằng
#     PostgreSQL client kết nối thẳng, giữ advisory lock (02 §3.1). Ở đây không
#     có DDL nên không cần advisory lock; chỉ tái dùng đúng đường admin path đó.
#     Không tạo scheduler, queue hay service mới.
#
# Hai job TƯỜNG MINH, không matrix. Mỗi service là một failure unit độc lập: một
# bên hỏng thì run đỏ và bên kia **không** được báo là thành công thay nó, và
# không có job gate gộp nào che mất điều đó. Một matrix cũng không dùng được ở
# đây: biến của matrix chọn được `environment` nhưng không chọn được **tên**
# secret, nên mọi leg sẽ phải nhận cả hai credential — đúng thứ điều kiện "không
# dùng chung credential" cấm.
#
# ── Bất biến ─────────────────────────────────────────────────────────────────
#   (1) Mỗi job chỉ chạm schema của chính nó, bằng credential của chính nó. Ranh
#       giới đó được kiểm Ở PHÍA SERVER trước khi xoá hàng nào: script hỏi
#       `current_user` và `has_table_privilege(..., 'DELETE')`, rồi so với
#       `EXPECTED_IDENTITY` của job. Một DSN dán nhầm service bị chặn, chứ không
#       âm thầm prune nhầm database.
#   (2) `DATABASE_URL` đến từ Environment riêng của từng service, chỉ được truyền
#       vào step prune (không phải `env:` cấp job) và chỉ mở ra bên trong
#       container — không bao giờ nội suy vào source shell hay echo ra host.
#   (3) Câu lệnh dùng đúng vị từ canonical: `expires_at < now()` với `now()` của
#       PostgreSQL. Không `TRUNCATE`, không `DROP`, không xoá theo tuổi cố định,
#       không sửa `expires_at`/TTL. Không cấp thêm quyền nào.
#   (4) **Bounded, không phải một `DELETE` không biên.** Một câu
#       `DELETE ... WHERE expires_at < now()` duy nhất sẽ giữ transaction (và
#       khoá hàng) tỉ lệ với toàn bộ backlog, rồi bị `timeout-minutes` cắt ngang
#       và **rollback sạch** — backlog không giảm được hàng nào, job đỏ lại mỗi
#       ngày. Thay vào đó script xoá theo **lô đã commit**, có ba trần: số hàng
#       mỗi lô (`BATCH_SIZE`), số lô (`MAX_BATCHES`) và thời gian (`MAX_SECONDS`),
#       cộng `statement_timeout`/`lock_timeout` cho từng lô. Điều kiện dừng bình
#       thường là lô trả 0 hàng.
#   (5) Kết nối/sự cố hỏng **không** được báo thành công: stdout rỗng hoặc không
#       phải số cũng là lỗi. Chạm trần cũng vậy, nhưng **có kiểm chứng**: trần chỉ
#       chứng minh ta dừng sớm, không chứng minh còn backlog. Nên khi chạm trần
#       script hỏi thẳng database một phép `EXISTS` rẻ; **còn** backlog thì
#       `outcome=cap_hit` + job **đỏ**, **hết** backlog (xoá vừa đủ lúc chạm trần)
#       thì `outcome=ok`. Retry bị chặn trong một run (tối đa `MAX_ATTEMPTS`) và chỉ
#       cho các mã thoát mang tính hỏng hóc tạm thời (psql `2` mất kết nối; docker
#       `125`). Mỗi lô idempotent nên chạy lại một phần dở dang vẫn an toàn.
#   (6) Log chỉ có service, outcome, số nonce đã dọn, số lô, thời lượng, số lần
#       thử. **Không** nonce, không chữ ký, không secret, không connection string,
#       không thân request: câu `DELETE` được bọc trong CTE để chỉ `count(*)` ra
#       tới stdout.
#   (7) TLS là **bắt buộc**, và được kiểm trên chính DSN chứ không tin vào sàn
#       environment: `PGSSLMODE=require` chỉ là sàn, còn conninfo thắng environment.
#       Credential ở đây là migrator/owner-level nên không được phép hạ xuống
#       plaintext. DSN sai/thiếu `sslmode`, lặp khoá `sslmode`, hoặc mang `options=`
#       thì dừng ở `outcome=invalid_dsn` trước khi kết nối (xem comment ở khối TLS).
#
# Tần suất là **chính sách vận hành**, không phải cam kết bảo mật: nonce cũ nằm
# lại vẫn là nonce đã bị chiếm, nên nó vẫn chặn replay. Hàng đợi `schedule` có thể
# bị trì hoãn hoặc bỏ khi tải cao, và không có SLA cho thời điểm chạy — xem
# `docs/overview/04-platform-facts.md` §2.17.

on:
  # 03:17 UTC = 10:17 ICT. Phút lệch :00 là chủ ý: GitHub nêu tải cao điểm gồm
  # đầu mỗi giờ và khuyến nghị chọn phút khác (04 §2.17 GH2).
  schedule:
    - cron: '17 3 * * *'
  # Đường chạy tay có kiểm soát. Lưu ý: `schedule` chỉ chạy trên default branch,
  # còn dispatch nhận `ref` bất kỳ (04 §2.17 GH4, GH6).
  workflow_dispatch:

# Không cần token: workflow này không checkout và không gọi GitHub API.
permissions: {}

concurrency:
  # Hai run chồng nhau không gây sai dữ liệu (mỗi lô idempotent) nhưng làm
  # log/observability khó đọc và tăng tải. KHÔNG `cancel-in-progress`: một run
  # đang chạy phải hoàn tất vòng lặp/retry của nó trước run kế.
  group: identity-nonce-prune
  cancel-in-progress: false

env:
  # Ảnh client psql ghim theo **digest** (immutable), không theo tag trôi.
  PSQL_IMAGE: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  # MỘT script dùng chung cho cả hai job, tham số hoá bằng `env:` của từng job
  # (SERVICE / TARGET_SCHEMA / EXPECTED_IDENTITY / ENVIRONMENT_NAME / SECRET_NAME).
  # Hai job chép tay hai bản script gần giống nhau là đúng kiểu drift mà task yêu
  # cầu tránh: một bản vá chỉ áp cho `prune-auth` sẽ lặng lẽ bỏ `prune-account`.
  # Đặt ở đây thì nguồn sự thật của prune SQL là DUY NHẤT.
  PRUNE_SCRIPT: |
    set -euo pipefail

    # ── Hằng số của thuật toán (giống nhau cho cả hai kho) ─────────────────────
    # Một lô là một transaction riêng đã commit. 20 000 hàng/lô giữ mỗi lô ở mức
    # dưới giây trên bảng vài triệu hàng: đủ nhỏ để khoá hàng không giữ lâu, đủ
    # lớn để một backlog thường trực drain trong vài lô.
    readonly BATCH_SIZE=20000
    # Hai trần, hai kiểu "không drain hết" khác nhau: quá nhiều hàng so với số lô,
    # hoặc database chậm/khoá. Nên cần cả số lô lẫn thời gian.
    readonly MAX_BATCHES=50
    readonly MAX_SECONDS=600
    readonly MAX_ATTEMPTS=3

    # ── Biến bắt buộc ──────────────────────────────────────────────────────────
    # `DATABASE_URL` đến từ Environment riêng; phần còn lại từ `env:` cấp job.
    # Thiếu bất kỳ cái nào là cấu hình sai, không phải chuyện bỏ qua.
    missing=''
    for name in DATABASE_URL SERVICE TARGET_SCHEMA EXPECTED_IDENTITY ENVIRONMENT_NAME SECRET_NAME PSQL_IMAGE; do
      if [ -z "${!name:-}" ]; then
        missing="$missing $name"
      fi
    done
    if [ -n "$missing" ]; then
      echo "::error::service=${SERVICE:-unknown} outcome=not_configured pruned=0 batches=0 duration_s=0 retries=0 missing:$missing" >&2
      case "$missing" in
        *DATABASE_URL*)
          printf 'environment %s has no %s secret\n' "${ENVIRONMENT_NAME:-unknown}" "${SECRET_NAME:-unknown}" >&2
          ;;
      esac
      exit 1
    fi

    # ── TLS, và các tham số DSN có thể nới biên ────────────────────────────────
    # libpq mặc định `sslmode=prefer`: thử TLS rồi **âm thầm** lùi về plaintext nếu
    # phía server (hoặc kẻ đứng giữa) không đưa TLS ra. Credential ở đây là
    # migrator/owner-level, nên không được dựa vào mode mặc định (`03` §2.1).
    #
    # `PGSSLMODE` chỉ là **sàn**: nó áp dụng khi DSN không ghi `sslmode`, nhưng
    # conninfo **thắng** environment. Nên lớp quyết định là kiểm chính DSN.
    #
    # KHÔNG được kiểm bằng `case "$DATABASE_URL" in *sslmode=require*)`: đó là so
    # khớp **chuỗi con trên toàn bộ DSN**, và nó bỏ lọt đúng hai đường mà nó tưởng
    # đang chặn:
    #   1. mật khẩu chứa chuỗi `sslmode=require` làm DSN không khai `sslmode` nào
    #      cũng khớp;
    #   2. libpq lấy **khoá CUỐI** khi một tham số lặp. Đo trên libpq 17:
    #      `?sslmode=require&sslmode=disable` kết nối **plaintext**
    #      (`pg_stat_ssl.ssl = f`) dù chuỗi vẫn chứa `sslmode=require`.
    # Nên chỉ soi **phần query string** (bỏ userinfo — nơi mật khẩu sống) và đòi
    # đúng một `sslmode` nằm trong allow-list.
    #
    # `options=` trong DSN cũng bị chặn: conninfo thắng `PGOPTIONS` y như `sslmode`,
    # nên `options=-c statement_timeout=0` gỡ mất biên per-batch bên dưới, và trạng
    # thái cuối là một job bị `timeout-minutes` cắt ngang mà không có dòng `cap_hit`.
    export PGSSLMODE="${PGSSLMODE:-require}"

    dsn_reason=''
    case "$DATABASE_URL" in
      postgres://* | postgresql://*) ;;
      *) dsn_reason='not_a_uri' ;;
    esac
    if [ -z "$dsn_reason" ]; then
      # Phần sau dấu `?` đầu tiên; bỏ fragment nếu có. Không có `?` nghĩa là DSN
      # không khai tham số nào — và do đó cũng không có `sslmode`.
      dsn_query="${DATABASE_URL#*\?}"
      if [ "$dsn_query" = "$DATABASE_URL" ]; then dsn_query=''; fi
      dsn_query="${dsn_query%%#*}"
      sslmode_count=0
      sslmode_value=''
      saved_ifs=$IFS
      IFS='&'
      # `set -f`: tách token bằng `&` mà không để ký tự glob trong DSN bung ra.
      set -f
      for dsn_token in $dsn_query; do
        case "$dsn_token" in
          sslmode=*)
            sslmode_count=$((sslmode_count + 1))
            sslmode_value="${dsn_token#sslmode=}"
            ;;
          options=*) dsn_reason='options_override' ;;
        esac
      done
      set +f
      IFS=$saved_ifs
      if [ -z "$dsn_reason" ]; then
        if [ "$sslmode_count" -gt 1 ]; then
          dsn_reason='sslmode_duplicate'
        elif [ "$sslmode_count" -eq 0 ]; then
          dsn_reason='sslmode_missing'
        else
          case "$sslmode_value" in
            require | verify-ca | verify-full) ;;
            *) dsn_reason='sslmode_weak' ;;
          esac
        fi
      fi
    fi
    if [ -n "$dsn_reason" ]; then
      echo "::error::service=$SERVICE outcome=invalid_dsn reason=$dsn_reason pruned=0 batches=0 duration_s=0 retries=0 DATABASE_URL must be a postgres:// URI carrying exactly one sslmode of require/verify-ca/verify-full and no options= override; libpq's default 'prefer' can fall back to plaintext." >&2
      exit 1
    fi

    # ── Biên theo từng lô ──────────────────────────────────────────────────────
    # Hai biến dưới đây là một phần của "bounded", nên sống CÙNG script thay vì ở
    # `env:` của workflow: `docker run --env NAME` với NAME chưa đặt thì docker
    # **âm thầm bỏ qua**, nên một lần sửa YAML xoá nhầm dòng sẽ gỡ mất biên mà
    # không có gì đỏ. Đặt ở đây thì biên không thể mất, và vẫn override được từ
    # môi trường khi vận hành cần chỉnh.
    #
    # `PGOPTIONS` chặn một lô đơn lẻ treo vô hạn (statement 60 s, khoá 30 s), và
    # `PGCONNECT_TIMEOUT` bắt một host không trả lời hỏng trong 10 s. Không có hai
    # cái này thì "bounded" chỉ là mong muốn: trần thời gian của vòng lặp được
    # kiểm **giữa** các lô, nên nó không tự chặn được một lần gọi đang treo.
    export PGOPTIONS="${PGOPTIONS:--c statement_timeout=60000 -c lock_timeout=30000}"
    export PGCONNECT_TIMEOUT="${PGCONNECT_TIMEOUT:-10}"
    # Nhãn cho `pg_stat_activity`: người vận hành tìm "ai đang giữ khoá trên
    # internal_nonces" phải nhận ra job này ngay. `PGAPPNAME` đi theo đúng đường
    # tên-biến như DSN nên không phải secret.
    export PGAPPNAME="nonce-prune-$SERVICE"

    # ── Client psql ────────────────────────────────────────────────────────────
    # DSN chỉ được truyền theo *TÊN* biến: `docker run --env DATABASE_URL` đọc giá
    # trị từ môi trường của runner, nên connection string không bao giờ xuất hiện
    # trong argv — `ps`/`docker inspect` trên runner chỉ thấy tên biến. Trong
    # container, `sh -c 'exec psql "$DATABASE_URL" "$@"' -- "$@"` mở rộng biến tại
    # chỗ; `"$@"` là tham số psql (SQL, không phải secret).
    run_psql() {
      docker run --rm \
        --env DATABASE_URL \
        --env PGOPTIONS \
        --env PGCONNECT_TIMEOUT \
        --env PGAPPNAME \
        --env PGSSLMODE \
        "$PSQL_IMAGE" \
        sh -c 'exec psql "$DATABASE_URL" "$@"' -- "$@"
    }

    # Mã thoát psql (đo trên psql 17 với đúng dạng lời gọi dưới đây, không suy từ
    # tài liệu): 0 thành công; 1 lỗi ở cấp câu lệnh — SQL sai, thiếu quyền, hoặc
    # `statement_timeout` hết hạn; 2 không kết nối được tới server (kể cả sai mật
    # khẩu). Chỉ `2` (và `125` của `docker run` — daemon/registry thoáng qua) là
    # lớp hỏng có thể tự khỏi; thử lại mã khác chỉ làm chậm tín hiệu đỏ. Vì lỗi
    # quyền và `statement_timeout` đều trả `1`, một lô chậm hoặc thiếu quyền KHÔNG
    # bị thử lại ba lần — chủ ý: đó là vấn đề của database hay của quyền, và thử
    # lại chỉ kéo dài thời gian giữ khoá.
    #
    # Bộ đếm nằm trong một FILE, không trong biến: `psql_retry` luôn được gọi trong
    # command substitution (subshell), nên biến tăng ở đây sẽ biến mất khi hàm trả
    # về. Đọc/ghi file để nó sống sót tới dòng kết quả — dòng đó phải nói được
    # "lần chạy này đã phải thử lại", kể cả khi nó kết thúc xanh.
    retry_file=$(mktemp "${TMPDIR:-/tmp}/nonce-prune-retries.XXXXXX")
    printf '0' >"$retry_file"
    trap 'rm -f "$retry_file"' EXIT

    psql_retry() {
      local attempt=1 rc=0 out
      while :; do
        out=$(run_psql "$@") && rc=0 || rc=$?
        if [ "$rc" -eq 0 ]; then
          printf '%s' "$out"
          return 0
        fi
        case "$rc" in
          2 | 125)
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              printf '%s' "$(( $(cat "$retry_file") + 1 ))" >"$retry_file"
              echo "::warning::service=$SERVICE outcome=retrying psql_exit=$rc attempt=$attempt/$MAX_ATTEMPTS backoff_s=$((attempt * 5))" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
              continue
            fi
            ;;
        esac
        return "$rc"
      done
    }

    # Gọi psql rồi tự in dòng kết quả khi hỏng, thay vì để `set -e` kết thúc im
    # lặng: một đường ra không có dòng `service=... outcome=...` là một lần hỏng
    # không đọc được, và đó là điều tệ nhất với một job không người trực.
    #
    # `value=$(f) && rc=0 || rc=$?` là dạng duy nhất vừa lấy được mã thoát vừa
    # không bị `set -e` cắt ngang.
    run_or_report() {
      local what="$1" rc=0 value=''
      shift
      value=$(psql_retry "$@") && rc=0 || rc=$?
      if [ "$rc" -ne 0 ]; then
        local outcome='statement_failed'
        case "$rc" in
          2 | 125) outcome='db_unreachable' ;;
        esac
        echo "::error::service=$SERVICE outcome=$outcome psql_exit=$rc pruned=$deleted_total batches=$batches duration_s=$((SECONDS - started)) retries=$(cat "$retry_file") what=$what" >&2
        exit 1
      fi
      printf '%s' "$value"
    }

    # ── Preflight: đúng role, và role đó THẬT SỰ có `DELETE` ────────────────────
    # Kiểm bằng giá trị thật của server, không tin tên secret. So với danh tính
    # mong đợi `<role>|<trạng thái>`:
    #
    #   ecoma_auth_migrator|deletable   role đúng và có DELETE trên kho nonce
    #   <role khác>|*                   DSN của service khác dán nhầm vào đây
    #   <role>|no-delete                credential runtime, không phải migrator
    #   <role>|missing                  schema/bảng không tồn tại trong DB này
    #
    # Cố ý **không** so tên database: DSN là secret, và tên database không xuất
    # hiện ở đâu trong repo để mà ghim. Ranh giới service nằm ở role + sự tồn tại
    # của kho nonce, cả hai đều hỏi được từ server.
    #
    # `to_regclass` trả NULL (không lỗi) khi schema/bảng không tồn tại, và
    # `has_table_privilege` là STRICT nên NULL regclass cũng trả NULL — CASE dưới
    # đây không bao giờ ném lỗi vì bảng thiếu.
    IDENTITY_QUERY="SELECT current_user || '|' || CASE
      WHEN to_regclass('${TARGET_SCHEMA}.internal_nonces') IS NULL THEN 'missing'
      WHEN has_table_privilege(to_regclass('${TARGET_SCHEMA}.internal_nonces'), 'DELETE') THEN 'deletable'
      ELSE 'no-delete'
    END"

    # Đồng hồ của cả script, lấy trước preflight để mọi đường ra đều báo được
    # `duration_s`, kể cả đường hỏng ở lời gọi đầu tiên.
    started=$SECONDS

    # Bộ đếm được khai TRƯỚC preflight, không phải ngay trước vòng lặp: dòng lỗi
    # của `run_or_report` phải báo được số hàng **đã xoá thật**, kể cả khi lô thứ N
    # hỏng sau khi các lô trước đã commit. Khai muộn thì hàm không thấy biến (và
    # `set -u` làm script chết ở một chỗ khác), còn hard-code `pruned=0` thì một dòng
    # lỗi nói "không xoá hàng nào" trong khi đã xoá hàng trăm nghìn nonce — một tín
    # hiệu sai theo hướng nguy hiểm cho người trực.
    batches=0
    deleted_total=0
    capped=0

    identity=$(run_or_report identity_check -X -q -t -A -v ON_ERROR_STOP=1 -c "$IDENTITY_QUERY")
    if [ "$identity" != "$EXPECTED_IDENTITY" ]; then
      echo "::error::service=$SERVICE outcome=identity_mismatch connected_as=$identity expected=$EXPECTED_IDENTITY pruned=$deleted_total batches=$batches duration_s=$((SECONDS - started)) retries=$(cat "$retry_file") hint=expected_the_${SECRET_NAME}_credential_of_the_${TARGET_SCHEMA}_service" >&2
      exit 1
    fi

    # ── Câu prune ──────────────────────────────────────────────────────────────
    # Vị từ canonical, không được nới: `expires_at` = timestamp envelope + skew
    # chấp nhận + biên trễ đồng hồ, và nonce chỉ được ghi SAU khi chữ ký đã đúng,
    # nên một hàng thoả `expires_at < now()` không còn bảo vệ gì (envelope tương
    # ứng đã bị từ chối vì `bad_timestamp`). Xoá nonce còn hiệu lực là mở lại cửa
    # sổ replay — cùng lý do `TRUNCATE` bị cấm. Dấu so sánh là `<` chứ không `<=`:
    # hàng có `expires_at` đúng bằng `now()` vẫn được coi là còn sống.
    #
    # Hình dạng câu lệnh không phải chuyện thẩm mỹ: cách viết hiển nhiên
    # `DELETE ... USING (SELECT ... LIMIT n) b WHERE n.nonce = b.nonce` để planner
    # tự do đổi kế hoạch theo ước lượng — đo trên PostgreSQL 17 với 2,9 triệu hàng
    # đều hết hạn, ở lô 20 000 planner chọn `Hash Join` + `Seq Scan` TOÀN BẢNG làm
    # vế ngoài, tức mỗi lô quét cả bảng và tổng chi phí thành O(N²) đúng lúc backlog
    # lớn nhất. `WHERE nonce = ANY (ARRAY(SELECT ... LIMIT n))` ghim nó: `InitPlan`
    # chọn lô, rồi `Index Scan using internal_nonces_pkey`. Số đo là một lần chạy
    # trên container cục bộ, đọc như thứ tự độ lớn và hình dạng plan.
    #
    # Chuỗi SQL là string nhiều dòng thường (không heredoc): dòng kết thúc heredoc
    # không thể đứng ở cột 0 trong block scalar của YAML, nên heredoc sẽ nuốt phần
    # còn lại của script.
    SQL="
    WITH deleted AS (
      DELETE FROM ${TARGET_SCHEMA}.internal_nonces
       WHERE nonce = ANY (ARRAY(
               SELECT nonce
                 FROM ${TARGET_SCHEMA}.internal_nonces
                WHERE expires_at < now()
                LIMIT ${BATCH_SIZE}
             ))
      RETURNING 1
    )
    SELECT count(*) FROM deleted;"

    # Phép đếm "còn backlog không" cho nhánh chạm trần. `EXISTS … LIMIT 1` dừng ở
    # hàng hết hạn đầu tiên nên đi qua index `expires_at` và không quét cả bảng; nó
    # rẻ hơn nhiều so với `count(*)`, mà vẫn trả lời đúng câu hỏi cần trả lời.
    EXISTS_QUERY="SELECT EXISTS(
      SELECT 1 FROM ${TARGET_SCHEMA}.internal_nonces WHERE expires_at < now()
    );"

    # ── Vòng lặp có biên ───────────────────────────────────────────────────────
    # Mỗi vòng là một transaction riêng đã commit, nên một run bị ngắt giữa đường
    # vẫn để lại tiến độ thật và lần chạy sau tiếp tục từ chỗ còn lại: điều kiện
    # chọn hàng theo thời gian, không theo trạng thái tiến độ nào để hỏng.
    # (`batches` / `deleted_total` / `capped` đã khai trước preflight.)
    cap_reason=''

    while :; do
      if [ "$batches" -ge "$MAX_BATCHES" ]; then
        capped=1
        cap_reason='batches'
        break
      fi
      if [ "$((SECONDS - started))" -ge "$MAX_SECONDS" ]; then
        capped=1
        cap_reason='seconds'
        break
      fi

      batch=$(run_or_report batch_delete -X -q -t -A -v ON_ERROR_STOP=1 -c "$SQL")
      case "$batch" in
        '' | *[!0-9]*)
          echo "::error::service=$SERVICE outcome=unexpected_output returned=$batch pruned=$deleted_total batches=$batches duration_s=$((SECONDS - started)) retries=$(cat "$retry_file")" >&2
          exit 1
          ;;
      esac
      # 0 hàng = đã drain hết. Điều kiện dừng bình thường, không phải lỗi: chạy
      # lại trên một kho đã sạch phải thành công.
      if [ "$batch" -eq 0 ]; then
        break
      fi

      deleted_total=$((deleted_total + batch))
      batches=$((batches + 1))
      echo "service=$SERVICE batch=$batches deleted=$batch total=$deleted_total"
      # Lô cuối luôn nhỏ hơn kích thước lô; dừng luôn thay vì thêm một vòng chắc
      # chắn trả 0.
      if [ "$batch" -lt "$BATCH_SIZE" ]; then
        break
      fi
    done

    elapsed=$((SECONDS - started))
    retries_used=$(cat "$retry_file")

    # Chạm trần KHÔNG tự nó chứng minh còn backlog: lô cuối cùng có thể vừa xoá hết
    # đúng vào lúc chạm trần (ví dụ số nonce hết hạn đúng bằng `MAX_BATCHES ×
    # BATCH_SIZE`). Nếu cứ khẳng định `backlog_remains=true` mà không kiểm, một kho
    # **đã sạch** vẫn báo đỏ ở mọi lần chạy — cũng là một tín hiệu sai, chỉ khác
    # chiều. Nên hỏi thẳng database bằng một phép `EXISTS` rẻ (dùng index
    # `expires_at`) và chỉ báo đỏ khi nó xác nhận backlog thật còn.
    backlog_remains='not_probed'
    if [ "$capped" -ne 0 ]; then
      remaining=$(run_or_report backlog_probe -X -q -t -A -v ON_ERROR_STOP=1 -c "$EXISTS_QUERY")
      case "$remaining" in
        t)
          backlog_remains='true'
          # Fail closed: một backlog chưa drain hết không được báo xanh. Backlog
          # lớn dần trong im lặng là đúng thứ job này sinh ra để chặn. Lần chạy kế
          # tiếp tiếp tục từ chỗ còn lại, và người vận hành chạy tay để drain nhanh.
          outcome='cap_hit'
          ;;
        f)
          # Chạm trần nhưng đã drain hết: xoá xong là thành công, không phải lỗi.
          backlog_remains='false'
          outcome='ok'
          ;;
        *)
          echo "::error::service=$SERVICE outcome=unexpected_output returned=$remaining pruned=$deleted_total batches=$batches duration_s=$((SECONDS - started)) retries=$(cat "$retry_file") what=backlog_probe" >&2
          exit 1
          ;;
      esac
    else
      outcome='ok'
    fi

    # Dòng kết quả, cùng hình dạng cho mọi đường ra thành công — đây là thứ để grep
    # trong log CI, nên nó phải là dòng CUỐI **trên stdout** và đủ ngữ cảnh để không
    # cần đọc thêm. Các đường hỏng in `::error::` ra **stderr** với hình dạng riêng
    # (thêm `psql_exit`, `what=`, `missing:`, …); `::warning::` báo mỗi lần thử lại.
    echo "service=$SERVICE outcome=$outcome pruned=$deleted_total batches=$batches duration_s=$elapsed retries=$retries_used"

    {
      echo "### Prune expired nonces — \`$SERVICE\`"
      echo ''
      echo '| Item | Value |'
      echo '| --- | --- |'
      echo "| Credential identity | \`$EXPECTED_IDENTITY\` |"
      echo "| Batch size | $BATCH_SIZE (caps: $MAX_BATCHES batches, ${MAX_SECONDS}s) |"
      echo "| Batches run | $batches |"
      echo "| Rows deleted | $deleted_total |"
      echo "| Retries used | $retries_used |"
      echo "| Backlog remains | \`$backlog_remains\`${cap_reason:+ (cap: $cap_reason)} |"
      echo "| Result | \`$outcome\` |"
      echo "| Duration | ${elapsed}s |"
    } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

    if [ "$outcome" = 'cap_hit' ]; then
      echo "::error::service=$SERVICE outcome=cap_hit cap=$cap_reason pruned=$deleted_total batches=$batches duration_s=$elapsed retries=$retries_used backlog_remains=true" >&2
      exit 1
    fi

# ── Trần thời gian của job ────────────────────────────────────────────────────
# `timeout-minutes: 25` phải LỚN HƠN tổng trần bên trong script, nếu không runner
# kill job trước khi script kịp ghi step summary và thông báo lỗi — lúc đó người
# vận hành chỉ thấy một job bị huỷ, không biết nó chạm trần nào. Cận trên:
#
#   một lần gọi psql  ≤ MAX_ATTEMPTS × (connect 10s + statement 60s) + sleep 5+10
#                     = 3 × 70 + 15 = 225s
#   preflight         ≤ 225s
#   vòng lặp          ≤ MAX_SECONDS (600s) + một lô cuối ≤ 225s
#   backlog probe     ≤ 225s            (chỉ chạy khi chạm trần)
#   ──────────────────────────────────────────────────────────────
#   tổng              ≤ 1275s < 1500s
#
# Trần thời gian của vòng lặp được kiểm trước mỗi lô, nên nó không tính được một
# lần gọi đang chạy; đó là lý do phải cộng thêm 225s ở dòng "một lô cuối" và lý do
# `PGCONNECT_TIMEOUT`/`statement_timeout` phải có.
#
# **Chưa tính vào bảng trên:** lần `docker run` ĐẦU TIÊN phải kéo ảnh `psql` theo
# digest (runner mới không có sẵn), và việc kéo ảnh không bị `PGCONNECT_TIMEOUT`,
# `statement_timeout` hay `MAX_SECONDS` nào ràng buộc. Bình thường chỉ vài giây,
# nhưng đó là phần duy nhất của đường chạy không có trần trong script — nên biên
# thật nhỏ hơn 1500s một khoảng bằng thời gian kéo ảnh, và đây là lý do `25` chứ
# không phải một con số sát 1275s.

jobs:
  prune-auth:
    name: prune-auth
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # Environment riêng của service này: secret `DB_AUTH_MIGRATOR_URL` chỉ tồn tại
    # ở đây. THỨ TỰ QUAN TRỌNG: chính dòng `environment:` này khiến GitHub **tự
    # tạo** Environment ở lần chạy đầu tiên nếu nó chưa tồn tại — không branch
    # policy, không protection rule (02 §6.13). Vì vậy branch policy phải được đặt
    # **sau** khi workflow vào `main` (lần chạy đầu tạo nó ngầm) và **trước** khi
    # đặt secret: đặt secret trước là để credential `_migrator_` nằm trong một
    # Environment mà mọi ref đều dispatch được, và lúc đó không còn lớp fail-closed
    # nào trong repo. Branch policy của Environment mới là lớp giới hạn "chỉ main",
    # không phải guard bên dưới (04 §2.17 GH6–GH8; 02 §6.13 cho cùng học thuyết ở
    # làn production).
    environment: nonce-prune-auth
    env:
      SERVICE: auth
      TARGET_SCHEMA: auth
      EXPECTED_IDENTITY: ecoma_auth_migrator|deletable
      ENVIRONMENT_NAME: nonce-prune-auth
      SECRET_NAME: DB_AUTH_MIGRATOR_URL
    steps:
      # Guard fail-closed cho người thao tác tay: chặn dispatch lầm từ tag, SHA cũ
      # hay nhánh sai. **KHÔNG PHẢI LỚP BẢO VỆ ĐẦY ĐỦ** — bản workflow chạy theo
      # ref được dispatch, nên một tài khoản có quyền ghi repo có thể push một
      # nhánh xoá chính bước này. Lớp thật nằm ngoài repo: deployment branch policy
      # của Environment (chỉ `main`).
      - name: Guard the dispatch ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            printf 'nonce prune must run from main, got %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          printf 'dispatch ref guard passed: %s\n' "$GITHUB_REF"

      - name: Prune expired nonces
        # Secret chỉ ở step này, không phải `env:` cấp job: step guard và mọi thứ
        # khác không cầm credential.
        env:
          DATABASE_URL: ${{ secrets.DB_AUTH_MIGRATOR_URL }}
        # Guard fail-closed cho chính workflow: nếu `PRUNE_SCRIPT` bị xoá hoặc rỗng
        # (một lần sửa YAML hỏng), `bash -c ""` sẽ **exit 0** và job xanh với 0 hàng
        # dọn cùng không một dòng `service=… outcome=…` — đúng dạng hỏng im lặng mà
        # cả job này sinh ra để loại. `test -n` biến nó thành đỏ.
        run: test -n "$PRUNE_SCRIPT" || { printf 'PRUNE_SCRIPT is empty; refusing to run a no-op prune\n' >&2; exit 1; }; bash -c "$PRUNE_SCRIPT"

  prune-account:
    name: prune-account
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # Environment riêng: `DB_ACCOUNT_MIGRATOR_URL`. Cố ý KHÔNG dùng
    # `ecoma_account_runtime` dù runtime bên này có `DELETE` — hai job giữ cùng một
    # hình dạng quyền hạn, và bên `account` vẫn không phụ thuộc vào ngoại lệ của
    # chính nó khi chạy định kỳ. Thứ tự provision (branch policy TRƯỚC secret)
    # giống hệt job `prune-auth` — xem comment ở đó.
    environment: nonce-prune-account
    env:
      SERVICE: account
      TARGET_SCHEMA: account
      EXPECTED_IDENTITY: ecoma_account_migrator|deletable
      ENVIRONMENT_NAME: nonce-prune-account
      SECRET_NAME: DB_ACCOUNT_MIGRATOR_URL
    steps:
      - name: Guard the dispatch ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            printf 'nonce prune must run from main, got %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          printf 'dispatch ref guard passed: %s\n' "$GITHUB_REF"

      - name: Prune expired nonces
        env:
          DATABASE_URL: ${{ secrets.DB_ACCOUNT_MIGRATOR_URL }}
        # Guard fail-closed cho chính workflow: nếu `PRUNE_SCRIPT` bị xoá hoặc rỗng
        # (một lần sửa YAML hỏng), `bash -c ""` sẽ **exit 0** và job xanh với 0 hàng
        # dọn cùng không một dòng `service=… outcome=…` — đúng dạng hỏng im lặng mà
        # cả job này sinh ra để loại. `test -n` biến nó thành đỏ.
        run: test -n "$PRUNE_SCRIPT" || { printf 'PRUNE_SCRIPT is empty; refusing to run a no-op prune\n' >&2; exit 1; }; bash -c "$PRUNE_SCRIPT"
