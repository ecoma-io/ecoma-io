name: Code Review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request to review (the number alone)'
        type: string
        required: true
      full_review:
        description: 'Re-review from the merge-base instead of from the last checkpoint'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ocr-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review (OpenCodeReview)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # Disable the CLI's background self-updater to prevent package replacement mid-execution
      # (npm i -g @latest detached while 'ocr config set' runs) which causes "Cannot find module" races.
      OCR_NO_UPDATE: '1'
    steps:
      - name: Resolve PR info and check for changes
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            let pr;
            if (context.eventName === 'workflow_dispatch') {
              const requested = (process.env.PR_NUMBER || '').trim();
              if (!/^[1-9][0-9]*$/.test(requested)) {
                core.setFailed(`pr_number must be a pull request number alone; got ${JSON.stringify(requested)}.`);
                return;
              }
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(requested),
              });
              pr = data;
            } else {
              pr = context.payload.pull_request;
            }

            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body);

            // Kiểm tra số lượng commits hoặc đối chiếu HEAD SHA với BASE SHA
            const hasNoChanges = pr.commits === 0 || pr.head.sha === pr.base.sha;
            core.setOutput('skip_review', hasNoChanges ? 'true' : 'false');

            if (hasNoChanges) {
              core.info('No changes detected between head and base. Skipping review. Step will be skipped.');
            }

      - name: Preflight OpenCodeReview CLI
        if: steps.pr.outputs.skip_review != 'true'
        id: preflight
        shell: bash
        env:
          OCR_VERSION_PIN: '1.12.12'
        run: |
          set -euo pipefail
          # npm >= 11 gate install scripts bằng allow-scripts; bật đúng cho package
          # này để postinstall (tải binary + verify checksum) chạy một cách xác định.
          npm config set allow-scripts="@alibaba-group/open-code-review"
          npm install -g --no-audit --no-fund "@alibaba-group/open-code-review@${OCR_VERSION_PIN}"
          if ! command -v ocr >/dev/null 2>&1; then
            echo "::error::'ocr' executable không nằm trên PATH sau khi cài @alibaba-group/open-code-review@${OCR_VERSION_PIN}; kiểm tra liên kết bin toàn cục của npm."
            exit 1
          fi
          OCR_VERSION_OUTPUT="$(ocr version 2>/dev/null || true)"
          printf '%s\n' "$OCR_VERSION_OUTPUT"
          if ! printf '%s' "$OCR_VERSION_OUTPUT" | grep -qE "open-code-review[[:space:]]+v${OCR_VERSION_PIN//./\\.}([[:space:]]|\$)"; then
            echo "::error::Phiên bản OpenCodeReview không khớp pin: muốn v${OCR_VERSION_PIN}, nhận được: ${OCR_VERSION_OUTPUT}"
            exit 1
          fi
          echo "OpenCodeReview preflight OK: v${OCR_VERSION_PIN}."

      - name: Review the pull request
        id: ocr
        if: steps.pr.outputs.skip_review != 'true'
        uses: alibaba/open-code-review@182898cf522da3d04157b422752d028417974e19 # v1.12.12
        with:
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          pr_number: ${{ inputs.pr_number }}
          full_review: ${{ inputs.full_review }}
          background: |
            Project: Ecoma.io monorepo

            This is a greenfield platform under active construction. Distinguish
            implemented contracts from planned architecture; do not report intentionally
            unimplemented future capabilities as defects.

            Architecture invariants:
            - Services own their data; no cross-service direct database access.
            - Cross-service communication uses explicit APIs or events.
            - Services remain independently deployable.
            - No node-local durable/shared state.
            - Secrets must not leak to clients or logs.
            - API/event contract changes must remain expand-compatible.
            - Reliable event publication requires transactional outbox and idempotency
              where applicable.
            - Observability must not expose prompt bodies or sensitive request content.
            - Respect Nx project boundaries and service runtime constraints.

            Documentation and language:
            - Commit titles and messages must be written in English.
            - `AGENTS.md` must be written in English
            - Other documents must be written in Vietnamese, while retaining proper nouns, terminology, and technical terms in English.
            - All documents must be concise and succinct; they must be entirely free of internal contradictions and consistent with one another.
            - The documentation describes the desired target state; therefore, it can be written before the current state of the codebase.

            Review priorities:
            1. Architecture and boundary violations.
            2. Security and data exposure.
            3. Breaking API/event contracts.
            4. Persistence, transaction, consistency, and idempotency bugs.
            5. Reliability and production correctness.
            6. Significant performance regressions.

            Do not report style-only issues unless explicitly required by repository rules.

            PR Title: ${{ steps.pr.outputs.title || github.event.pull_request.title }}
            PR Description:
            ${{ steps.pr.outputs.body || github.event.pull_request.body }}
          llm_url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          llm_auth_token: ${{ secrets.ECOMA_LLM_API_KEY }}
          llm_model: glm-5.3-flash
          llm_use_anthropic: false
          llm_protocol: openai
          language: Vietnamese
          ocr_version: 1.12.12
          llm_timeout: '360'
          review_task_timeout: '30'
          effort: high
          review_concurrency: '8'
          stream_progress: 'true'
          upload_artifacts: 'true'
          sticky_summary: 'true'
          incremental: 'true'
          incremental_overlap_threshold: '0.75'
          checkpoint_range: 'true'
          resolve_outdated: 'true'
          route_severity_below: medium
