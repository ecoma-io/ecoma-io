name: Code Analysis

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: '/language:${{ matrix.language }}'

  semgrep:
    name: Semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the rules against their fixtures
        run: semgrep --test --config .github/semgrep .github/semgrep
      - name: Scan
        run: >-
          semgrep scan --config .github/semgrep
          --exclude .github/semgrep --sarif --output semgrep.sarif
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Enforce the repository's own rules
        run: semgrep scan --config .github/semgrep --exclude .github/semgrep --error --quiet

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan for secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          REPORT_PATH: ${{ runner.temp }}/results.sarif
        run: |
          rc=0
          "$GITLEAKS_BIN" detect \
            --source="$GITHUB_WORKSPACE" \
            --redact --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path="$REPORT_PATH" || rc=$?
          case "$rc" in
            0)
              echo "No leaks detected"
              ;;
            2)
              {
                echo "## Gitleaks detected secrets"
                echo ""
                echo "| Rule | File | Line | Commit |"
                echo "| ---- | ---- | ---- | ------ |"
              } >> "$GITHUB_STEP_SUMMARY"
              jq -r '
                .runs[0].results[]
                | [
                    .ruleId,
                    .locations[0].physicalLocation.artifactLocation.uri,
                    (.locations[0].physicalLocation.region.startLine | tostring),
                    .partialFingerprints.commitSha
                  ]
                | @tsv' "$REPORT_PATH" \
                | awk -F "\t" \
                  '{ printf "| `%s` | `%s` | %s | %s |\n", $1, $2, $3, substr($4, 1, 12) }' \
                  >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Leaks detected — every finding is printed above and in the job summary."
              exit 2
              ;;
            *)
              echo "::error::gitleaks exited with code $rc — the scan did not complete, and an incomplete scan is not a clean pass."
              exit "$rc"
              ;;
          esac
      - name: Upload the findings report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results.sarif
          path: ${{ runner.temp }}/results.sarif
          if-no-files-found: ignore

  analysis-gate:
    name: analysis-gate
    needs: [codeql, semgrep, gitleaks]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/aggregate-gate
        with:
          results: ${{ join(needs.*.result, ' ') }}
          gate-name: 'analysis-gate'
