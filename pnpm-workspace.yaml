packages:
  - 'apps/*'
  - 'tools/*'
  - 'docs'
autoInstallPeers: true

# pnpm >= 11 không còn đọc `only-built-dependencies` trong `.npmrc`; danh sách
# build script được phép chạy khai báo ở đây, và chỉ ở đây.
#
# Thiếu một package ở đây ⇒ `pnpm install` exit code 1 với
# ERR_PNPM_IGNORED_BUILDS, nên thêm package mới có postinstall là phải bổ sung
# ở đây luôn.
allowBuilds:
  nx: true
  '@parcel/watcher': true
  '@scarf/scarf': true
  esbuild: true
  lefthook: true
  protobufjs: true
  unrs-resolver: true
  workerd: true
  sharp: true

# Patch tạm cho @nx/js: getInputs() áp offset cho `include` nhưng bỏ sót cho
# `exclude`, khiến exclude của .nuxt/tsconfig.*.json (vd `../../../node_modules`)
# bị tính sai fileset. Gỡ khi upstream fix (nrwl/nx#26521).
patchedDependencies:
  '@nx/js@23.3.0': patches/@nx__js@23.3.0.patch
  nuxt-content-assets@3.0.1: patches/nuxt-content-assets@3.0.1.patch
